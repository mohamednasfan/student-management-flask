<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">
        <h2 class="text-center mb-4">🎓 Student Management</h2>

        <form action="/add" method="POST" class="row g-2">
            <div class="col-md-5">
                <input type="text" name="name" class="form-control" placeholder="Enter Name" required>
            </div>
            <div class="col-md-5">
                <input type="number" name="age" class="form-control" placeholder="Enter Age" required>
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100">Add</button>
            </div>
        </form>
    </div>

    <div class="card shadow mt-4 p-3">
        <h4>📋 Student List</h4>

        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {% for student in students %}
                <tr>
                    <td>{{ student.id }}</td>
                    <td>{{ student.name }}</td>
                    <td>{{ student.age }}</td>
                    <td>
                        <a href="/edit/{{ student.id }}" class="btn btn-warning btn-sm">Edit</a>
                        <a href="/delete/{{ student.id }}" class="btn btn-danger btn-sm">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>

</div>

</body>
</html>
